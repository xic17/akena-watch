name: CI

on:
  push:
    branches: [main]
  pull_request:

# Permisos mínimos: el flujo solo lee el código (compila, prueba y valida).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # La misma versión que declara go.mod: si no, CI solo pasa porque Go
          # descarga la versión mayor en silencio (y el toolchain nuevo lo impide).
          go-version: "1.25"

      - name: Formato (gofmt)
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: Compilación
        run: go build ./...

      - name: Typecheck del Worker de Cloudflare
        working-directory: deploy/cloudflare
        run: |
          npm ci
          npx tsc --noEmit

      - name: Sintaxis del instalador y smoke test
        run: |
          sh -n scripts/install.sh
          sh -n scripts/smoke.sh
