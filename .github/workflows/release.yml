name: Release

# Publica binarios listos para instalar cuando se crea una etiqueta v*:
#   git tag v1.0.0
#   git push origin v1.0.0
on:
  push:
    tags: ["v*"]
  # Permite lanzar la release manualmente si GitHub se traga el evento del tag:
  #   gh workflow run Release --ref v1.0.4
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Compilar binarios (linux + darwin, amd64 + arm64)
        run: make release

      - name: Publicar release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/akena-watch-*
            dist/SHA256SUMS
            scripts/install.sh
          generate_release_notes: true
