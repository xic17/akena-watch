<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{block "title" .}}Akena Watch{{end}} · Akena Watch</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%3E%3Crect%20width='24'%20height='24'%20rx='6'%20fill='%23f59e0b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  {{if .User}}
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/dashboard">
        {{template "paw" .}}
        <span class="brand-name">Akena Watch</span>
        <span class="brand-tagline">Siempre en Guardia</span>
      </a>
      <nav class="topnav">
        <a href="/dashboard">Monitores</a>
        <a href="/tools">Herramientas</a>
        {{if .IsAdmin}}<a href="/users">Usuarios</a>{{end}}
        <a href="/about">Acerca de</a>
        <span class="user-chip">{{.Username}}</span>
        <button id="logout-btn" class="btn ghost tiny" type="button">Salir</button>
      </nav>
    </div>
  </header>
  {{end}}

  <main class="container">
    {{block "content" .}}{{end}}
  </main>

  <footer class="footer">
    <span class="footer-paw">{{template "paw" .}}</span>
    <span>Siempre en Guardia — en memoria de Akena · v{{.Version}}</span>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>

{{define "paw"}}<svg class="paw" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="6.8" cy="9.2" r="2.1"/><circle cx="12" cy="7.4" r="2.2"/><circle cx="17.2" cy="9.2" r="2.1"/><circle cx="9.2" cy="12.6" r="2.3"/><circle cx="14.8" cy="12.6" r="2.3"/><path d="M12 14.8c-3.1 0-5.2 2.1-5.2 4.1 0 1.3 1 2.1 2.5 2.1h5.4c1.5 0 2.5-.8 2.5-2.1 0-2-2.1-4.1-5.2-4.1z"/></svg>{{end}}
